title: Revenue Execution
description: "Read-only Salesforce dashboards: late deals and their owners, close reasons, and products that lose."
# The site's own _layouts/; GitHub Pages applies jekyll-theme-primer unless theme is null.
theme: null
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: index.md
    values:
      layout: home
