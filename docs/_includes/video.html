{%- assign v = site.data.videos[include.id] -%}
<figure class="video">
  <video id="video-{{ include.id }}" controls playsinline preload="{{ include.preload | default: 'none' }}" poster="assets/videos/{{ include.id }}.jpg" aria-label="{{ v.alt }}">
    <source src="assets/videos/{{ include.id }}.mp4" type="video/mp4">
    <track kind="captions" src="assets/videos/{{ include.id }}.vtt" srclang="en" label="English">
  </video>
  <figcaption>{{ v.title }} <span>{{ v.length }}</span></figcaption>
</figure>
